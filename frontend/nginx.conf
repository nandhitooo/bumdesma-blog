# Protokol asli klien. Di belakang Caddy, header ini sudah berisi "https";
# tanpa reverse proxy tambahan, nilainya diambil dari skema koneksi ke nginx.
map $http_x_forwarded_proto $client_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Situs publik: aplikasi React satu halaman, dengan /api, /uploads, dan berkas
# SEO diteruskan ke container API. Nama host "backend" adalah nama service di
# docker-compose.yml.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Batas unggah API 2 MB; beri ruang untuk overhead multipart.
    client_max_body_size 5m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Gunakan header dari proxy ini saat API membaca IP klien untuk rate limit.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_proto;

    location /api/ {
        proxy_pass http://backend:4000;
    }

    # Gambar unggahan disimpan API, bukan di dalam image frontend.
    location /uploads/ {
        proxy_pass http://backend:4000;
    }

    # Berkas SEO dan pratinjau tautan dilayani API di root domain.
    location = /robots.txt {
        proxy_pass http://backend:4000;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:4000;
    }

    location = /feed.xml {
        proxy_pass http://backend:4000;
    }

    location /share/ {
        proxy_pass http://backend:4000;
    }

    # Nama berkas hasil build mengandung hash, jadi aman di-cache lama. Satu
    # header saja: memakai `expires` sekaligus `add_header` menghasilkan dua
    # nilai Cache-Control pada respons yang sama.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html tidak boleh di-cache agar rilis baru langsung terpakai.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Rute React (/blog, /admin, ...) tidak punya berkas sendiri.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Profil produksi. Dipakai bersama berkas dasar:
#
#   DOMAIN=bumdesma.example.id \
#   ACME_EMAIL=admin@example.id \
#   PUBLIC_SITE_URL=https://bumdesma.example.id \
#   CLIENT_ORIGIN=https://bumdesma.example.id \
#   JWT_SECRET=$(openssl rand -hex 32) \
#   POSTGRES_PASSWORD=$(openssl rand -hex 16) \
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Nilai-nilai itu juga bisa ditulis di .env root agar tidak perlu diulang.
# Membutuhkan Docker Compose 2.24+ karena memakai tag !reset.
name: bumdesma

services:
  db:
    restart: always
    environment:
      # Hanya dipakai saat volume database pertama kali dibuat. Mengubahnya
      # setelah data ada tidak mengubah password user di dalam PostgreSQL.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD yang kuat}

  backend:
    restart: always
    environment:
      # Validasi env saat start menolak host lokal pada URL publik, jadi
      # semuanya wajib diisi dan tidak punya nilai default.
      NODE_ENV: production
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?isi PUBLIC_SITE_URL, mis. https://bumdesma.example.id}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?isi CLIENT_ORIGIN, mis. https://bumdesma.example.id}
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET acak minimal 32 karakter}
      # Klien -> Caddy -> nginx frontend -> API, jadi dua hop di depan API.
      TRUST_PROXY: ${TRUST_PROXY:-2}

  frontend:
    restart: always
    # Port tidak dibuka ke host; hanya Caddy yang menghubungi container ini.
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      frontend:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN:?isi DOMAIN tanpa https, mis. bumdesma.example.id}
      ACME_EMAIL: ${ACME_EMAIL:?isi ACME_EMAIL untuk pendaftaran sertifikat}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Sertifikat dan akun ACME harus bertahan agar tidak meminta ulang
      # sertifikat setiap container dibuat ulang (ada batas permintaan).
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
